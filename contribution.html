<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Contribution</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 0 auto; padding: 32px 16px; line-height: 1.5; }
    button { font: inherit; padding: 8px 14px; cursor: pointer; }
    #contributor-student-id { margin: 16px 0; font-weight: 600; min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Team Contribution</h1>
  <button id="load-contributor">Show Contributor</button>
  <p id="contributor-student-id"></p>
  <p><a href="index.html">Back to Task Manager</a></p>

  <script>
    document.getElementById("load-contributor").addEventListener("click", async () => {
      const out = document.getElementById("contributor-student-id");
      try {
        const res = await fetch("contribution.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        out.textContent = "Contributor Student ID: " + data.contributorStudentId;
      } catch (e) {
        out.textContent = "Could not load contributor: " + e.message;
      }
    });
  </script>
</body>
</html>
